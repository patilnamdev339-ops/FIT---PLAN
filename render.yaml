services:
  # 1. Python Flask Backend API Service
  - type: web
    name: fitplan-backend-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: mysql
      - key: STRICT_MYSQL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_HOST
        value: mysql-3f751391-patilnamdev339-ba47.d.aivencloud.com
      - key: MYSQL_PORT
        value: "14873"
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: defaultdb
      - key: MYSQL_SSL_CA
        value: backend/certs/ca.pem
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: FRONTEND_ORIGIN
        sync: false

  # 2. React + Vite Static Frontend Site
  - type: web
    name: fitplan-frontend
    runtime: static
    rootDir: ProjectOverview
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
